            - heading "Overview" [level=2] [ref=e134]
            - paragraph [ref=e135]:
              - strong [ref=e136]: Executive Summary
            - paragraph [ref=e137]: The core challenge of EchoYeast is to rapidly and reproducibly screen, from 17 nanobody sequences, the recognition element with the highest specificity for H1N1 HA and the lowest cross-reactivity risk, and to further validate the molecular mechanisms of two gating systems (hM1Dq and STE2).
            - paragraph [ref=e138]: "We established a computational-first / model-guided multiscale molecular docking and simulation pipeline:"
            - list [ref=e139]:
              - listitem [ref=e140]: Structure prediction using AlphaFold2/ColabFold;
              - listitem [ref=e141]: Initial screening by multi-antigen rigid docking with ClusPro;
              - listitem [ref=e142]: Semi-flexible refinement with HADDOCK 2.5;
              - listitem [ref=e143]: Interface analysis with PyMOL + SPICE;
              - listitem [ref=e144]: 100 ns MD with GROMACS;
              - listitem [ref=e145]: Binding free energy calculation and per-residue decomposition with gmx_MMPBSA;
              - listitem [ref=e146]: Positive control redocking with 9VH4;
              - listitem [ref=e147]: Parallel modeling of the Path A (hM1Dq) and Path B (STE2) gating systems.
            - paragraph [ref=e148]: By combining multiple orthogonal computational methods, we reduced the 17-candidate nanobody pool to a single lead (R1aB6) and identified a testable mutational hypothesis (R31A). Crucially, our model-guided design of the STE2 gating construct was successfully translated into a living yeast chassis and verified via colony PCR and sequencing, completing the dry-to-wet lab design loop. This provides a prioritized experimental roadmap rather than a replacement for wet-lab validation.
            - paragraph [ref=e149]: "Key conclusions:"
