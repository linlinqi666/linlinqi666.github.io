            - paragraph [ref=e193]:
              - strong [ref=e194]: "Important Statement:"
              - text: Except for the STE2 gating construct assembly reported in B.8, all computational data on this page are derived from molecular modeling and have not yet been validated by wet-lab experiments. The ultimate value of the model lies in providing testable hypotheses (the ARG-B:31 hotspot and the R31A mutant) and prioritization for subsequent experiments.
            - paragraph [ref=e195]:
              - strong [ref=e196]: "Wet-Lab Translation:"
              - text: The model-designed STE2 gating construct (pep + nanobody) was successfully assembled in yeast and verified by sequencing (96.9% identity).
            - paragraph [ref=e197]:
              - strong [ref=e198]: 1. Motivation and Design Need
            - paragraph [ref=e199]: EchoYeast requires a nanobody that specifically recognizes the hemagglutinin (HA) of influenza A (H1N1) virus with minimal cross-reactivity. We have 17 candidate nanobody sequences, but none of them have experimental structures in the PDB; moreover, screening them one by one by wet-lab experiments is both time-consuming and expensive.
            - paragraph [ref=e200]: "Therefore, the model must answer the following scientific questions:"
            - list [ref=e201]:
              - listitem [ref=e202]: Among the 17 candidate nanobodies, which one has the optimal binding ability and specificity for H1N1 HA?
              - listitem [ref=e203]: What is the binding mode between this nanobody and H1N1 HA? What are the key hotspot residues?
              - listitem [ref=e204]: In the two gating systems hM1Dq and STE2, how do the auto-inhibitory peptides bind the receptor? How does GPA1 couple?
              - listitem [ref=e205]: Which candidates should be prioritized for wet-lab experiments? Which should be eliminated?
            - paragraph [ref=e206]: We adopt a computational-first / model-guided strategy, using multiscale computational models to guide experimental design rather than replace experiments.
            - paragraph [ref=e207]:
              - strong [ref=e208]: 2. System Overview and Modeling Logic
            - paragraph [ref=e209]:
              - strong [ref=e210]: 2.1 Three main lines
            - paragraph [ref=e211]: "Part 1 (Common Foundation): HA × nanobody docking — screening R1aB6 ├── Path A (hM1Dq gating system): hM1Dq + MT1 + humanized GPA1 └── Path B (STE2 gating system): STE2 + auto-inhibitory peptides + GPA1"
            - 'figure "Figure 1. Overall modelling pipeline: Part 1 screens the recognition element (17 nanobodies → R1aB6); Part 2 validates the two gating systems at atomic level (computational predictions, not experimental results)" [ref=e212]':
              - 'img "Figure 1. Overall EchoYeast modelling pipeline: 17 nanobody sequences are structure-predicted with AlphaFold2/ColabFold 1.6.2 and docked by ClusPro against 6 antigens; the top 5 candidates are refined with HADDOCK 2.5, analysed with PyMOL + SPICE, and checked with 100 ns MD and MM-GBSA against the 9VH4 positive control; Part 2 runs the same pipeline on the hM1Dq and Ste2 gating systems" [ref=e213]'
            - paragraph [ref=e215]:
              - strong [ref=e216]: 2.2 Logic Chain
            - paragraph [ref=e217]:
              - text: Question (Which nanobody is optimal?) → Hypothesis (rigid + semi-flexible + MD can converge candidates) → Methods (ClusPro → HADDOCK → PyMOL/SPICE → 100 ns MD → MM-GBSA) → Outputs (specificity index / HADDOCK score / interface residues / RMSD / ΔG
              - subscript [ref=e218]: bind
              - text: / hotspot residues) → Validation (positive control redocking + multi-method cross-validation) → Design decision (select R1aB6, propose an R31A mutant).
            - paragraph [ref=e219]:
              - strong [ref=e220]: 2.3 Seven-Stage Method Workflow (Part 1)
            - paragraph [ref=e221]: "The questions, methods, and outputs of the seven stages:"
            - table [ref=e222]:
