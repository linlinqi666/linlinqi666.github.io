          - paragraph [ref=e617]:
            - strong [ref=e618]: Membrane MD validation of G protein coupling
          - paragraph [ref=e619]: This work has completed membrane MD validation of two gating interfaces, hM1Dq–MT1 and STE2–pep5. For the G protein coupling interfaces (hM1Dq–GPA1 and STE2–GPA1), we have completed HADDOCK semi-flexible refinement and SPICE interface analysis and identified key coupling residues. Because the complete GPA1 trimer membrane system (approximately 850,000 atoms) requires approximately 2–3 weeks to complete 100 ns MD under the available computational resources, we list it as next-stage work. The current HADDOCK data (Gpα single-chain score = −149.4, superior to total = −131.7) already support the conclusion that the coupling interface is primarily mediated by Gα.
