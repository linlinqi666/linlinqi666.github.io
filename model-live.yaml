            - paragraph [ref=e266]:
              - strong [ref=e267]: 2.4 Rationale for Method Selection
            - paragraph [ref=e268]:
              - text: Our pipeline adopts a physics-based strategy, prioritizing interpretability and reproducibility. ClusPro
              - link "[1]" [ref=e269] [cursor=pointer]:
                - /url: "#model-reference-1"
              - text: was chosen for fast rigid-body screening
              - link "[2]" [ref=e270] [cursor=pointer]:
                - /url: "#model-reference-2"
              - text: across 17 candidates. HADDOCK was selected for its semi-flexible
              - link "[3]" [ref=e271] [cursor=pointer]:
                - /url: "#model-reference-3"
              - text: refinement, allowing CDR loop flexibility based on our AlphaFold2 pLDDT scores. Finally, GROMACS
              - link "[5]" [ref=e272] [cursor=pointer]:
                - /url: "#model-reference-5"
              - text: with the Amber99SB-ILDN force field was used to capture the explicit-solvent dynamics, which is essential for accurate MM-GBSA calculations. This multi-scale approach ensures that our computational predictions provide an actionable roadmap for wet-lab experiments.
            - paragraph [ref=e273]:
              - strong [ref=e274]: 2.5 Gating System Pathways (Path A / B)
            - paragraph [ref=e275]:
              - text: "Each pathway follows a unified workflow: Structure preparation → OPM/PPM membrane alignment"
              - link "[11]" [ref=e276] [cursor=pointer]:
                - /url: "#model-reference-11"
              - text: → HADDOCK docking → SPICE analysis → CHARMM-GUI membrane system → GROMACS MD → gmx_MMPBSA.
