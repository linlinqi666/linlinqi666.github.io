<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" width="1080" height="608" role="img">
  <defs>
    <pattern id="expected" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3F4A54" stroke-width="1.1"/>
    </pattern>
  </defs>

  <rect width="1080" height="608" fill="#FFFFFF"/>

  <!-- 三条受益空间：高度不同，但都停在同一块前提上 -->
  <g stroke="#3F4A54" stroke-width="1.5" stroke-linejoin="round">
    <rect x="220" y="220" width="140" height="220" rx="4" fill="url(#expected)"/>
    <rect x="420" y="280" width="140" height="160" rx="4" fill="url(#expected)"/>
    <rect x="620" y="310" width="140" height="130" rx="4" fill="url(#expected)"/>
    <rect x="160" y="440" width="760" height="18" rx="5" fill="#3F4A54" fill-opacity="0.08"/>
  </g>

  <!-- 柱顶对象：健康防护、环境负荷、单次成本 -->
  <g fill="none" stroke="#3F4A54" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(290,182)">
      <path d="M 0 -26 L 19 -17 L 19 1 C 19 15 9 23 0 27 C -9 23 -19 15 -19 1 L -19 -17 Z"/>
    </g>
    <g transform="translate(490,236)">
      <path d="M 0 26 C -23 8 -23 -15 0 -26 C 23 -15 23 8 0 26 Z"/>
      <line x1="0" y1="20" x2="0" y2="-20" stroke-width="1.3"/>
    </g>
    <g transform="translate(690,266)">
      <circle cx="0" cy="0" r="21"/>
      <circle cx="0" cy="0" r="14" stroke-width="1.3"/>
    </g>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17" fill="#3F4A54">
    <text x="290" y="122" text-anchor="middle">health protection</text>
    <text x="490" y="176" text-anchor="middle">environmental load</text>
    <text x="690" y="206" text-anchor="middle">cost per test</text>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#5A6672">
    <text x="540" y="498" text-anchor="middle">shared precondition: deployment density</text>
    <text x="540" y="530" text-anchor="middle">hatched bars = expected, not yet quantified</text>
  </g>
</svg>
