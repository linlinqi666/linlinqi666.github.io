<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" width="1080" height="608" role="img">
  <rect width="1080" height="608" fill="#FFFFFF"/>

  <!-- 检测阈值：客观分界 -->
  <line x1="520" y1="200" x2="520" y2="530" stroke="#9AA5AF" stroke-width="1.2" stroke-dasharray="6 6"/>

  <g fill="none" stroke="#3F4A54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- 时间轴：左端为刻度，右端箭头表示时间流向 -->
    <line x1="72" y1="500" x2="1006" y2="500"/>
    <line x1="72" y1="488" x2="72" y2="512"/>
    <path d="M 1006 500 L 986 492 M 1006 500 L 986 508"/>

    <!-- 空气监测装置：在阈值之前发出预警 -->
    <g transform="translate(232.4,282) scale(1.2)">
      <line x1="72" y1="4" x2="72" y2="18"/>
      <circle cx="72" cy="3" r="3"/>
      <rect x="0" y="18" width="96" height="118" rx="10"/>
      <circle cx="48" cy="54" r="24"/>
      <circle cx="48" cy="54" r="16"/>
      <circle cx="48" cy="54" r="8"/>
      <line x1="48" y1="30" x2="48" y2="78"/>
      <line x1="24" y1="54" x2="72" y2="54"/>
      <rect x="14" y="84" width="68" height="11" rx="3"/>
      <line x1="22" y1="89.5" x2="62" y2="89.5"/>
      <rect x="16" y="104" width="40" height="17" rx="3"/>
      <circle cx="74" cy="112" r="4.5"/>
    </g>

    <!-- 报警信号：三道外扩的弧 -->
    <path d="M 356 350 Q 366 366 356 382" stroke-width="1.3"/>
    <path d="M 372 336 Q 388 366 372 396" stroke-width="1.3"/>
    <path d="M 388 322 Q 410 366 388 410" stroke-width="1.3"/>

    <!-- 听诊器：等病灶显现才听得见 -->
    <path d="M 770 126 C 770 180 796 210 826 230"/>
    <path d="M 882 126 C 882 180 856 210 826 230"/>
    <path d="M 826 230 C 828 292 812 338 776 368 C 752 386 726 395 700 396"/>
    <circle cx="770" cy="120" r="6.5"/>
    <circle cx="882" cy="120" r="6.5"/>
    <circle cx="700" cy="438" r="42"/>
    <circle cx="700" cy="438" r="24"/>

    <!-- 由工具指向时间轴上的发现时点（虚线＝指向，不是实物的一部分） -->
    <g stroke-dasharray="5 5" stroke-width="1.2">
      <line x1="290" y1="452" x2="290" y2="492"/>
      <line x1="700" y1="482" x2="700" y2="492"/>
    </g>
  </g>

  <circle cx="700" cy="438" r="6" fill="#3F4A54"/>

  <!-- 时点节点：空心＝我们的预警位置；实心＝现有检测的位置 -->
  <circle cx="290" cy="500" r="7.5" fill="#FFFFFF" stroke="#3F4A54" stroke-width="1.6"/>
  <circle cx="700" cy="500" r="7.5" fill="#3F4A54"/>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#5A6672">
    <text x="534" y="222">detection threshold</text>
    <text x="290" y="556" text-anchor="middle" fill="#3F4A54">our warning point</text>
    <text x="700" y="556" text-anchor="middle" fill="#3F4A54">current detection point</text>
  </g>
</svg>
