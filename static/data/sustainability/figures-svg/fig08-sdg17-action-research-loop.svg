<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" width="1080" height="608" role="img">
  <defs>
    <marker id="cycleArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#19486A" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1080" height="608" fill="#FFFFFF"/>

  <!-- 四个步骤首尾相衔：诊断 → 规划 → 行动 → 反思 → 诊断 -->
  <g fill="none" stroke="#19486A" stroke-width="1.6" stroke-linecap="round">
    <path d="M 611.8 155.9 A 170 170 0 0 1 694.1 238.2" marker-end="url(#cycleArrow)"/>
    <path d="M 694.1 381.8 A 170 170 0 0 1 611.8 464.1" marker-end="url(#cycleArrow)"/>
    <path d="M 468.2 464.1 A 170 170 0 0 1 385.9 381.8" marker-end="url(#cycleArrow)"/>
    <path d="M 385.9 238.2 A 170 170 0 0 1 468.2 155.9" marker-end="url(#cycleArrow)"/>
  </g>

  <g fill="none" stroke="#19486A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="540" cy="140" r="56"/>
    <circle cx="710" cy="310" r="56"/>
    <circle cx="540" cy="480" r="56"/>
    <circle cx="370" cy="310" r="56"/>
  </g>

  <g fill="none" stroke="#19486A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 诊断 -->
    <g transform="translate(540,138)">
      <circle cx="0" cy="0" r="15"/>
      <line x1="10.6" y1="10.6" x2="23" y2="23"/>
    </g>

    <!-- 规划 -->
    <g transform="translate(710,306)">
      <rect x="-16" y="-17" width="32" height="40" rx="3"/>
      <rect x="-6" y="-22" width="12" height="8" rx="2"/>
      <line x1="-8" y1="-4" x2="8" y2="-4"/>
      <line x1="-8" y1="4" x2="8" y2="4"/>
      <line x1="-8" y1="12" x2="2" y2="12"/>
    </g>

    <!-- 行动：把方案做成装置 -->
    <g transform="translate(520,452) scale(0.42)">
      <line x1="72" y1="4" x2="72" y2="18"/>
      <circle cx="72" cy="3" r="3"/>
      <rect x="0" y="18" width="96" height="118" rx="10"/>
      <circle cx="48" cy="54" r="24"/>
      <circle cx="48" cy="54" r="16"/>
      <circle cx="48" cy="54" r="8"/>
      <line x1="48" y1="30" x2="48" y2="78"/>
      <line x1="24" y1="54" x2="72" y2="54"/>
      <rect x="14" y="84" width="68" height="11" rx="3"/>
      <line x1="22" y1="89.5" x2="62" y2="89.5"/>
      <rect x="16" y="104" width="40" height="17" rx="3"/>
      <circle cx="74" cy="112" r="4.5"/>
    </g>

    <!-- 反思：回到起点的回头箭头 -->
    <g transform="translate(370,310)">
      <path d="M 15 0 A 15 15 0 1 1 0 -15" marker-end="url(#cycleArrow)"/>
    </g>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17" fill="#19486A">
    <text x="540" y="62" text-anchor="middle">diagnose</text>
    <text x="790" y="316" text-anchor="start">plan</text>
    <text x="540" y="562" text-anchor="middle">act</text>
    <text x="290" y="316" text-anchor="end">reflect</text>
  </g>
</svg>
