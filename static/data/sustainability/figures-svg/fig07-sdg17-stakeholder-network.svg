    <circle cx="72" cy="3" r="3"/>
    <rect x="0" y="18" width="96" height="118" rx="10"/>
    <circle cx="48" cy="54" r="24"/>
    <circle cx="48" cy="54" r="16"/>
    <circle cx="48" cy="54" r="8"/>
    <line x1="48" y1="30" x2="48" y2="78"/>
    <line x1="24" y1="54" x2="72" y2="54"/>
    <rect x="14" y="84" width="68" height="11" rx="3"/>
    <line x1="22" y1="89.5" x2="62" y2="89.5"/>
    <rect x="16" y="104" width="40" height="17" rx="3"/>
    <circle cx="74" cy="112" r="4.5"/>
  </g>

  <!-- 七类伙伴：临床、疾控与卫健、硬件工程、学术同行、公众与学校、iGEM 队伍、产业 -->
  <g fill="none" stroke="#19486A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="540" cy="90" r="50"/>
    <circle cx="837" cy="169" r="50"/>
    <circle cx="910.4" cy="346.9" r="50"/>
    <circle cx="704.9" cy="489.2" r="50"/>
    <circle cx="375.1" cy="489.2" r="50"/>
    <circle cx="169.6" cy="346.9" r="50"/>
    <circle cx="243" cy="169" r="50"/>
  </g>

  <g fill="none" stroke="#19486A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
