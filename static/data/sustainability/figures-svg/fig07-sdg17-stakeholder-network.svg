    <g transform="translate(540,88)">
      <path d="M -8 -20 C -8 -8 -4 -2 0 2"/>
      <path d="M 8 -20 C 8 -8 4 -2 0 2"/>
      <circle cx="-9" cy="-23" r="3.5"/>
      <circle cx="9" cy="-23" r="3.5"/>
      <line x1="0" y1="2" x2="0" y2="6"/>
      <circle cx="0" cy="14" r="8"/>
