    </marker>
  </defs>

  <rect width="1080" height="608" fill="#FFFFFF"/>

  <!-- 七类伙伴各自把判断带进项目：箭头一律指向中心的装置 -->
  <g fill="none" stroke="#19486A" stroke-width="1.4" stroke-linecap="round">
    <path d="M 540 140 L 540 200" marker-end="url(#inwardArrow)"/>
    <path d="M 791.3 189.2 L 631.5 259.6" marker-end="url(#inwardArrow)"/>
    <path d="M 860.8 340.6 L 639.2 312.6" marker-end="url(#inwardArrow)"/>
    <path d="M 672 451.5 L 605.7 375.4" marker-end="url(#inwardArrow)"/>
    <path d="M 408 451.5 L 474.3 375.4" marker-end="url(#inwardArrow)"/>
    <path d="M 219.2 340.6 L 440.8 312.6" marker-end="url(#inwardArrow)"/>
    <path d="M 288.7 189.2 L 448.5 259.6" marker-end="url(#inwardArrow)"/>
  </g>

  <!-- 中心：项目自身的装置 -->
  <g fill="none" stroke="#19486A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(487.2,223) scale(1.1)">
