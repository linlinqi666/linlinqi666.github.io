      <path d="M -22 20 C -22 8 -18 3 -14 3 C -10 3 -6 8 -6 20"/>
      <path d="M -11 20 C -11 4 -6 -3 0 -3 C 6 -3 11 4 11 20"/>
      <path d="M 6 20 C 6 8 10 3 14 3 C 18 3 22 8 22 20"/>
    </g>

