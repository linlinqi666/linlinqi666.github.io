<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" width="1080" height="608" role="img">
  <rect width="1080" height="608" fill="#FFFFFF"/>

  <g fill="none" stroke="#3F4A54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- 时间轴 -->
    <line x1="100" y1="400" x2="980" y2="400"/>
    <line x1="100" y1="388" x2="100" y2="412"/>
    <path d="M 980 400 L 960 392 M 980 400 L 960 408"/>

    <!-- 阶段 1：病毒仍在空气中 -->
    <g transform="translate(212,262)">
      <circle cx="0" cy="0" r="26"/>
      <g stroke-width="1.2">
        <line x1="0" y1="-26" x2="0" y2="-36"/><circle cx="0" cy="-36" r="2.6"/>
        <line x1="0" y1="26" x2="0" y2="36"/><circle cx="0" cy="36" r="2.6"/>
        <line x1="-26" y1="0" x2="-36" y2="0"/><circle cx="-36" cy="0" r="2.6"/>
        <line x1="26" y1="0" x2="36" y2="0"/><circle cx="36" cy="0" r="2.6"/>
        <line x1="-18.4" y1="-18.4" x2="-25.5" y2="-25.5"/><circle cx="-25.5" cy="-25.5" r="2.6"/>
        <line x1="18.4" y1="-18.4" x2="25.5" y2="-25.5"/><circle cx="25.5" cy="-25.5" r="2.6"/>
        <line x1="-18.4" y1="18.4" x2="-25.5" y2="25.5"/><circle cx="-25.5" cy="25.5" r="2.6"/>
        <line x1="18.4" y1="18.4" x2="25.5" y2="25.5"/><circle cx="25.5" cy="25.5" r="2.6"/>
      </g>
    </g>
    <g stroke-width="1.2" stroke-dasharray="7 6">
      <path d="M 108 214 L 158 214"/>
      <path d="M 108 250 L 150 250"/>
      <path d="M 108 286 L 158 286"/>
    </g>

    <!-- 阶段 2：病毒进入人体 -->
    <g transform="translate(470,250)">
      <circle cx="0" cy="-38" r="20"/>
      <path d="M -40 60 C -40 4 -22 -14 0 -14 C 22 -14 40 4 40 60"/>
    </g>
    <g transform="translate(376,290)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#3F4A54" stroke-width="1.5"/>
      <g fill="none" stroke="#3F4A54" stroke-width="1.2">
        <line x1="0" y1="-18" x2="0" y2="-25"/><circle cx="0" cy="-25" r="2.2"/>
        <line x1="0" y1="18" x2="0" y2="25"/><circle cx="0" cy="25" r="2.2"/>
        <line x1="-18" y1="0" x2="-25" y2="0"/><circle cx="-25" cy="0" r="2.2"/>
        <line x1="12.7" y1="-12.7" x2="17.7" y2="-17.7"/><circle cx="17.7" cy="-17.7" r="2.2"/>
        <line x1="12.7" y1="12.7" x2="17.7" y2="17.7"/><circle cx="17.7" cy="17.7" r="2.2"/>
      </g>
    </g>
    <path d="M 400 276 L 430 260" stroke-width="1.4"/>
    <path d="M 430 260 L 415 261 M 430 260 L 424 273" stroke-width="1.4"/>

    <!-- 阶段 3：越过阈值，症状出现 -->
    <g transform="translate(690,250)">
      <circle cx="0" cy="-38" r="20"/>
      <path d="M -40 60 C -40 4 -22 -14 0 -14 C 22 -14 40 4 40 60"/>
    </g>
    <g transform="translate(766,258) rotate(18)" fill="none" stroke="#3F4A54" stroke-width="1.5" stroke-linecap="round">
      <rect x="-9" y="-64" width="18" height="88" rx="9"/>
      <circle cx="0" cy="34" r="14"/>
      <line x1="0" y1="-40" x2="0" y2="20" stroke-width="1.2"/>
    </g>

    <!-- 阶段 4：就诊确诊 -->
    <g transform="translate(920,250)">
      <rect x="-36" y="-70" width="72" height="130" rx="5"/>
      <rect x="-28" y="-62" width="56" height="114" rx="3" stroke-width="1.2"/>
      <circle cx="22" cy="0" r="4" stroke-width="1.2"/>
    </g>

    <!-- 时间轴上的四个阶段节点 -->
    <circle cx="212" cy="400" r="6.5"/>
    <circle cx="458" cy="400" r="6.5"/>
    <circle cx="690" cy="400" r="6.5"/>
    <circle cx="920" cy="400" r="6.5"/>
  </g>

  <!-- 我们的覆盖窗口：病毒入体之前（绿色实线＋浅填充） -->
  <rect x="130" y="450" width="196" height="12" rx="6" fill="#4C9F38" fill-opacity="0.14" stroke="#4C9F38" stroke-width="1.6"/>
  <!-- 现有检测的覆盖窗口：症状出现之后（灰色虚线，无填充） -->
  <rect x="628" y="450" width="352" height="12" rx="6" fill="none" stroke="#9AA5AF" stroke-width="1.6" stroke-dasharray="6 5"/>

  <!-- 统一装置：画在它真正工作的那个窗口上方 -->
  <g fill="none" stroke="#4C9F38" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(271.6,194) scale(0.8)">
    <line x1="72" y1="4" x2="72" y2="18"/>
    <circle cx="72" cy="3" r="3"/>
    <rect x="0" y="18" width="96" height="118" rx="10"/>
    <circle cx="48" cy="54" r="24"/>
    <circle cx="48" cy="54" r="16"/>
    <circle cx="48" cy="54" r="8"/>
    <line x1="48" y1="30" x2="48" y2="78"/>
    <line x1="24" y1="54" x2="72" y2="54"/>
    <rect x="14" y="84" width="68" height="11" rx="3"/>
    <line x1="22" y1="89.5" x2="62" y2="89.5"/>
    <rect x="16" y="104" width="40" height="17" rx="3"/>
    <circle cx="74" cy="112" r="4.5"/>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16">
    <text x="228" y="522" text-anchor="middle" fill="#3F7A2E">our device</text>
    <text x="804" y="522" text-anchor="middle" fill="#5A6672">current detection</text>
  </g>
</svg>
