<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" width="1080" height="608" role="img">
  <rect width="1080" height="608" fill="#FFFFFF"/>

  <g fill="none" stroke="#3F4A54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="90" y="196" width="220" height="220" rx="10"/>
    <rect x="330" y="196" width="220" height="220" rx="10"/>
    <rect x="570" y="196" width="220" height="220" rx="10"/>
    <rect x="810" y="196" width="220" height="220" rx="10"/>
  </g>

  <g fill="none" stroke="#3F4A54" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <!-- 风险 1：把筛查结果当成诊断结论 -->
    <g transform="translate(200,294)">
      <path d="M -40 0 C -22 -25 22 -25 40 0 C 22 25 -22 25 -40 0 Z"/>
      <circle cx="0" cy="0" r="12" stroke-width="1.5"/>
      <line x1="-48" y1="-46" x2="48" y2="46" stroke-width="2.2"/>
    </g>

    <!-- 风险 2：耗材与废弃物 -->
    <g transform="translate(440,294)">
      <path d="M -21 -15 L 21 -15 L 15 26 C 14 30 10 33 6 33 L -6 33 C -10 33 -14 30 -15 26 Z"/>
      <line x1="-28" y1="-15" x2="28" y2="-15"/>
      <path d="M -8 -15 L -8 -22 L 8 -22 L 8 -15"/>
      <rect x="-8" y="-7" width="16" height="26" rx="3" stroke-width="1.4"/>
    </g>

    <!-- 风险 3：细胞壁穿透这一前提尚未证实 -->
    <g transform="translate(680,288)">
      <circle cx="0" cy="0" r="28"/>
      <circle cx="0" cy="0" r="21" stroke-width="1.3"/>
      <path d="M 0 62 L 0 34" stroke-dasharray="6 5" stroke-width="1.4"/>
      <line x1="-10" y1="24" x2="10" y2="44" stroke-width="2.2"/>
      <line x1="10" y1="24" x2="-10" y2="44" stroke-width="2.2"/>
    </g>

    <!-- 风险 4：生物安全 -->
    <g transform="translate(920,292)">
      <path d="M 0 -28 L 19 -18 L 19 2 C 19 16 10 25 0 28 C -10 25 -19 16 -19 2 L -19 -18 Z"/>
      <circle cx="0" cy="0" r="8" stroke-width="1.4"/>
    </g>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17" fill="#3F4A54" text-anchor="middle">
    <text x="200" y="378">misuse</text>
    <text x="440" y="378">waste</text>
    <text x="680" y="378">unproven premise</text>
    <text x="920" y="378">biosafety</text>
  </g>
</svg>
