<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" width="1080" height="608" role="img">
  <defs>
    <marker id="recycleArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#BF8B2E" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1080" height="608" fill="#FFFFFF"/>

  <!-- 上行：集中式实验室路线，每次检测都消耗新的一份试剂 -->
  <g fill="none" stroke="#3F4A54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="120" y="120" width="150" height="126" rx="8"/>
    <rect x="142" y="142" width="106" height="48" rx="4" stroke-width="1.2"/>
    <circle cx="154" cy="216" r="5" stroke-width="1.2"/>
    <circle cx="176" cy="216" r="5" stroke-width="1.2"/>
    <path d="M 322 183 L 372 183" stroke-width="1.4"/>
    <path d="M 372 183 L 358 177 M 372 183 L 358 189" stroke-width="1.4"/>
  </g>
  <g fill="#3F4A54" fill-opacity="0.22" stroke="#3F4A54" stroke-width="1.4">
    <rect x="420" y="114" width="36" height="138" rx="18"/>
    <rect x="502" y="114" width="36" height="138" rx="18"/>
    <rect x="584" y="114" width="36" height="138" rx="18"/>
    <rect x="666" y="114" width="36" height="138" rx="18"/>
    <rect x="748" y="114" width="36" height="138" rx="18"/>
    <rect x="830" y="114" width="36" height="138" rx="18"/>
  </g>

  <!-- 分隔：上下两种物料策略的对照 -->
  <line x1="100" y1="292" x2="980" y2="292" stroke="#9AA5AF" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- 下行：机身与滤芯可重复使用，试剂以冻干粉形态储存 -->
  <g fill="none" stroke="#BF8B2E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(140,350) scale(0.9)">
    <line x1="72" y1="4" x2="72" y2="18"/>
    <circle cx="72" cy="3" r="3"/>
    <rect x="0" y="18" width="96" height="118" rx="10"/>
    <circle cx="48" cy="54" r="24"/>
    <circle cx="48" cy="54" r="16"/>
    <circle cx="48" cy="54" r="8"/>
    <line x1="48" y1="30" x2="48" y2="78"/>
    <line x1="24" y1="54" x2="72" y2="54"/>
    <rect x="14" y="84" width="68" height="11" rx="3"/>
    <line x1="22" y1="89.5" x2="62" y2="89.5"/>
    <rect x="16" y="104" width="40" height="17" rx="3"/>
    <circle cx="74" cy="112" r="4.5"/>
  </g>
  <rect x="330" y="392" width="46" height="70" rx="8" fill="none" stroke="#BF8B2E" stroke-width="1.6"/>
  <path d="M 324 427 L 246 427" fill="none" stroke="#BF8B2E" stroke-width="1.5"/>
  <path d="M 246 427 L 260 421 M 246 427 L 260 433" fill="none" stroke="#BF8B2E" stroke-width="1.5"/>

  <!-- 复用循环 -->
  <g fill="none" stroke="#BF8B2E" stroke-width="1.5" stroke-linecap="round">
    <path d="M 599 368.3 A 68 68 0 0 1 599 479.7" marker-end="url(#recycleArrow)"/>
    <path d="M 588.7 485.6 A 68 68 0 0 1 492.3 429.9" marker-end="url(#recycleArrow)"/>
    <path d="M 492.3 418.1 A 68 68 0 0 1 588.7 362.4" marker-end="url(#recycleArrow)"/>
  </g>

  <!-- 冻干粉试剂：便于储存与分发 -->
  <g fill="none" stroke="#BF8B2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="830" y="376" width="48" height="102" rx="14"/>
    <rect x="822" y="360" width="64" height="18" rx="6"/>
    <path d="M 840 446 L 868 446" stroke-width="1.2"/>
    <path d="M 840 458 L 868 458" stroke-width="1.2"/>
  </g>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#5A6672">
    <text x="120" y="90">single-use reagents, prepared for every run</text>
    <text x="270" y="338" text-anchor="middle">reusable housing and replaceable filter</text>
    <text x="560" y="338" text-anchor="middle">reuse cycle</text>
    <text x="854" y="338" text-anchor="middle">lyophilised reagent, stored dry</text>
  </g>
</svg>
