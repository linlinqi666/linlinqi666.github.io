<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" width="1080" height="608" role="img">
  <rect width="1080" height="608" fill="#FFFFFF"/>

  <g fill="none" stroke="#3F4A54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- 酵母细胞：细胞壁（双线）＋质膜；纳米抗体立在质膜上，朝向细胞壁 -->
    <circle cx="400" cy="320" r="200"/>
    <circle cx="400" cy="320" r="188"/>
    <circle cx="400" cy="320" r="145" stroke-width="1.2"/>

    <!-- 细胞核 -->
    <circle cx="450" cy="380" r="58" stroke-width="1.2"/>

    <!-- 细胞壁上这段通道尚未被验证：虚线 -->
    <path d="M 228.5 217 A 200 200 0 0 1 268.8 169.1" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 228.5 217 A 200 200 0 0 1 268.8 169.1" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- 未验证的一步：完整病毒能否穿过细胞壁抵达质膜（虚线箭头 ＋ 问号） -->
    <path d="M 235.3 181.8 L 265.9 207.5" stroke-dasharray="6 6" stroke-width="1.4"/>
    <path d="M 265.9 207.5 L 251.6 204.4 M 265.9 207.5 L 259.6 194.6" stroke-width="1.4"/>
    <path d="M 298 142 C 298 132 314 132 314 142 C 314 150 306 152 306 160" stroke-width="1.4"/>
    <circle cx="306" cy="170" r="1.8"/>

    <!-- 信号级联：质膜上的受体 → 细胞核 -->
    <path d="M 294 231 C 292 300 350 340 404 340"/>
    <path d="M 404 340 L 390 334 M 404 340 L 392 347"/>
  </g>

  <!-- 纳米抗体：Y 形，立在质膜上 -->
  <g fill="none" stroke="#FD6925" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(288.9,226.8) rotate(310)">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <path d="M -12 -24 L 0 -12 L 12 -24"/>
    </g>
    <g transform="translate(449.6,183.7) rotate(20)">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <path d="M -12 -24 L 0 -12 L 12 -24"/>
    </g>
    <g transform="translate(536.3,270.4) rotate(70)">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <path d="M -12 -24 L 0 -12 L 12 -24"/>
    </g>
    <g transform="translate(511.1,413.2) rotate(130)">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <path d="M -12 -24 L 0 -12 L 12 -24"/>
    </g>
    <g transform="translate(274.4,392.5) rotate(240)">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <path d="M -12 -24 L 0 -12 L 12 -24"/>
    </g>
    <g transform="translate(257.2,294.8) rotate(280)">
      <line x1="0" y1="0" x2="0" y2="-12"/>
      <path d="M -12 -24 L 0 -12 L 12 -24"/>
    </g>
  </g>

  <!-- 病毒颗粒：留在细胞外，尚未证明能够穿壁抵达识别单元 -->
  <g transform="translate(199.3,151.5)" fill="none" stroke="#3F4A54" stroke-width="1.5" stroke-linecap="round">
    <circle cx="0" cy="0" r="46"/>
    <g stroke-width="1.2">
      <line x1="0" y1="-46" x2="0" y2="-62"/><circle cx="0" cy="-62" r="3.5"/>
      <line x1="0" y1="46" x2="0" y2="62"/><circle cx="0" cy="62" r="3.5"/>
      <line x1="-46" y1="0" x2="-62" y2="0"/><circle cx="-62" cy="0" r="3.5"/>
      <line x1="-32.5" y1="-32.5" x2="-43.8" y2="-43.8"/><circle cx="-43.8" cy="-43.8" r="3.5"/>
      <line x1="32.5" y1="-32.5" x2="43.8" y2="-43.8"/><circle cx="43.8" cy="-43.8" r="3.5"/>
      <line x1="39.8" y1="23" x2="53.7" y2="31"/><circle cx="53.7" cy="31" r="3.5"/>
    </g>
    <line x1="35.2" y1="29.6" x2="40.4" y2="34" stroke-width="2.4"/>
  </g>

  <!-- 报告输出：被激活表达的荧光蛋白 -->
  <g>
    <circle cx="450" cy="380" r="12" fill="#FD6925"/>
    <g stroke="#FD6925" stroke-width="1.6" stroke-linecap="round">
      <line x1="450" y1="352" x2="450" y2="342"/>
      <line x1="475.7" y1="360.3" x2="482.8" y2="353.2"/>
      <line x1="475.7" y1="399.7" x2="482.8" y2="406.8"/>
      <line x1="450" y1="408" x2="450" y2="418"/>
      <line x1="424.3" y1="399.7" x2="417.2" y2="406.8"/>
      <line x1="424.3" y1="360.3" x2="417.2" y2="353.2"/>
    </g>
  </g>

  <!-- 图例：解码图中的视觉编码 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#5A6672">
    <g fill="none" stroke="#FD6925" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(716,286) rotate(-45)">
        <line x1="0" y1="0" x2="0" y2="-12"/>
        <path d="M -12 -24 L 0 -12 L 12 -24"/>
      </g>
    </g>
    <text x="762" y="292">nanobody on the plasma membrane</text>

    <line x1="700" y1="376" x2="748" y2="376" stroke="#3F4A54" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text x="762" y="382">unverified cell-wall passage</text>

    <circle cx="724" cy="462" r="10" fill="#FD6925"/>
    <text x="762" y="468">reporter output</text>
  </g>
</svg>
