<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f5ecd3"/>
    </linearGradient>
    <radialGradient id="cellGrad" cx="0.4" cy="0.4">
      <stop offset="0%" stop-color="#f9e8b8"/>
      <stop offset="100%" stop-color="#e6cc8a"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- yeast cell -->
  <ellipse cx="360" cy="300" rx="180" ry="150" fill="url(#cellGrad)" stroke="#8b5a2b" stroke-width="3"/>
  <circle cx="260" cy="240" r="18" fill="#d4b476" opacity="0.6"/>
  <circle cx="420" cy="220" r="12" fill="#d4b476" opacity="0.6"/>
  <circle cx="320" cy="360" r="14" fill="#d4b476" opacity="0.6"/>
  <circle cx="450" cy="340" r="10" fill="#d4b476" opacity="0.6"/>
  <path d="M360 150 Q400 130 440 160" stroke="#8b5a2b" stroke-width="3" fill="none" opacity="0.4"/>
  <circle cx="440" cy="160" r="22" fill="#f9e8b8" stroke="#8b5a2b" stroke-width="2"/>
  <!-- virus particle -->
  <g transform="translate(580,180)">
    <circle r="45" fill="#e8f4fd" stroke="#4a90e2" stroke-width="3"/>
    <g stroke="#4a90e2" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-45" x2="0" y2="-65"/>
      <line x1="32" y1="-32" x2="46" y2="-46"/>
      <line x1="45" y1="0" x2="65" y2="0"/>
      <line x1="32" y1="32" x2="46" y2="46"/>
      <line x1="0" y1="45" x2="0" y2="65"/>
      <line x1="-32" y1="32" x2="-46" y2="46"/>
      <line x1="-45" y1="0" x2="-65" y2="0"/>
      <line x1="-32" y1="-32" x2="-46" y2="-46"/>
    </g>
    <circle r="16" fill="#4a90e2" opacity="0.2"/>
  </g>
  <!-- signal arrow -->
  <path d="M520 280 Q560 260 580 240" stroke="#34A853" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#34A853"/>
    </marker>
  </defs>
  <!-- small virus particles -->
  <circle cx="680" cy="420" r="18" fill="#e8f4fd" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="140" cy="180" r="14" fill="#e8f4fd" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#8b5a2b" opacity="0.6">EchoYeast Concept Preview</text>
</svg>