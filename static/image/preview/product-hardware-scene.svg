<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" fill="none">
  <defs>
    <linearGradient id="hwBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f7e8"/>
      <stop offset="100%" stop-color="#e8e4d0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#hwBg)"/>
  <!-- handheld device -->
  <rect x="260" y="110" width="160" height="200" rx="16" fill="#fff" stroke="#8b5a2b" stroke-width="3"/>
  <rect x="275" y="135" width="130" height="110" rx="4" fill="#f0f6fc" stroke="#4a90e2" stroke-width="2"/>
  <!-- screen content: yeast + signal -->
  <ellipse cx="340" cy="190" rx="35" ry="28" fill="#f9e8b8" stroke="#8b5a2b" stroke-width="2"/>
  <circle cx="360" cy="175" r="5" fill="#34A853" opacity="0.8"/>
  <text x="340" y="232" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a90e2">ECHO+</text>
  <rect x="305" y="260" width="70" height="10" rx="5" fill="#d4b476"/>
  <!-- test tube / sample -->
  <rect x="520" y="140" width="50" height="140" rx="4" fill="rgba(200,220,240,0.4)" stroke="#4a90e2" stroke-width="2"/>
  <rect x="522" y="220" width="46" height="58" fill="#f9e8b8" opacity="0.7"/>
  <rect x="515" y="132" width="60" height="12" rx="2" fill="#8b5a2b"/>
  <!-- connection line -->
  <line x1="420" y1="210" x2="520" y2="210" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- labels -->
  <text x="340" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">便携读取设备（概念预览）</text>
  <text x="545" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">样本管</text>
  <!-- decorative yeast in background -->
  <circle cx="140" cy="260" r="35" fill="#f9e8b8" opacity="0.4" stroke="#8b5a2b" stroke-width="2"/>
  <circle cx="760" cy="140" r="25" fill="#e8f4fd" opacity="0.4" stroke="#4a90e2" stroke-width="2"/>
</svg>