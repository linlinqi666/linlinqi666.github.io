<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="chartBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f0e4"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(74,144,226,0.3)"/>
      <stop offset="100%" stop-color="rgba(74,144,226,0.05)"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#chartBg)"/>
  <!-- axes -->
  <line x1="80" y1="460" x2="880" y2="460" stroke="#8b5a2b" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="460" stroke="#8b5a2b" stroke-width="2"/>
  <!-- grid lines -->
  <line x1="80" y1="380" x2="880" y2="380" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="300" x2="880" y2="300" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="220" x2="880" y2="220" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="140" x2="880" y2="140" stroke="#ddd" stroke-width="1"/>
  <!-- area under curve -->
  <path d="M80 460 L160 420 L240 360 L320 300 L400 220 L480 160 L560 140 L640 180 L720 260 L800 340 L880 400 L880 460 Z" fill="url(#areaGrad)"/>
  <!-- curve -->
  <path d="M80 460 L160 420 L240 360 L320 300 L400 220 L480 160 L560 140 L640 180 L720 260 L800 340 L880 400" fill="none" stroke="#4a90e2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data points -->
  <circle cx="160" cy="420" r="6" fill="#4a90e2"/>
  <circle cx="240" cy="360" r="6" fill="#4a90e2"/>
  <circle cx="320" cy="300" r="6" fill="#4a90e2"/>
  <circle cx="400" cy="220" r="6" fill="#4a90e2"/>
  <circle cx="480" cy="160" r="6" fill="#c94c4c"/>
  <circle cx="560" cy="140" r="8" fill="#c94c4c"/>
  <circle cx="640" cy="180" r="6" fill="#4a90e2"/>
  <circle cx="720" cy="260" r="6" fill="#4a90e2"/>
  <circle cx="800" cy="340" r="6" fill="#4a90e2"/>
  <circle cx="880" cy="400" r="6" fill="#4a90e2"/>
  <!-- x labels -->
  <text x="80" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">1月</text>
  <text x="240" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">3月</text>
  <text x="400" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">5月</text>
  <text x="560" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">7月</text>
  <text x="720" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">9月</text>
  <text x="880" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a">11月</text>
  <!-- y label -->
  <text x="30" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5a4a3a" transform="rotate(-90 30 270)">阳性检出率（示意）</text>
  <!-- title -->
  <text x="480" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#8b5a2b">季节性流感流行曲线（示意数据）</text>
</svg>