<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f0e6cc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="480" fill="url(#sky)"/>
  <!-- buildings -->
  <rect x="60" y="180" width="100" height="200" fill="#e6dcc3" stroke="#8b5a2b" stroke-width="2"/>
  <rect x="80" y="210" width="25" height="30" fill="#a8c8e8"/>
  <rect x="115" y="210" width="25" height="30" fill="#a8c8e8"/>
  <rect x="80" y="260" width="25" height="30" fill="#a8c8e8"/>
  <rect x="115" y="260" width="25" height="30" fill="#a8c8e8"/>
  <rect x="180" y="140" width="120" height="240" fill="#d9cdb0" stroke="#8b5a2b" stroke-width="2"/>
  <rect x="205" y="170" width="25" height="35" fill="#a8c8e8"/>
  <rect x="250" y="170" width="25" height="35" fill="#a8c8e8"/>
  <rect x="205" y="230" width="25" height="35" fill="#a8c8e8"/>
  <rect x="250" y="230" width="25" height="35" fill="#a8c8e8"/>
  <rect x="205" y="290" width="25" height="35" fill="#a8c8e8"/>
  <rect x="250" y="290" width="25" height="35" fill="#a8c8e8"/>
  <!-- hospital cross -->
  <rect x="420" y="160" width="110" height="220" fill="#e6dcc3" stroke="#8b5a2b" stroke-width="2"/>
  <rect x="465" y="190" width="20" height="50" fill="#c94c4c"/>
  <rect x="450" y="205" width="50" height="20" fill="#c94c4c"/>
  <!-- bus -->
  <rect x="80" y="400" width="160" height="60" rx="10" fill="#d4b476" stroke="#8b5a2b" stroke-width="2"/>
  <rect x="95" y="415" width="35" height="25" fill="#a8c8e8"/>
  <rect x="140" y="415" width="35" height="25" fill="#a8c8e8"/>
  <rect x="185" y="415" width="35" height="25" fill="#a8c8e8"/>
  <circle cx="110" cy="460" r="12" fill="#5a4a3a"/>
  <circle cx="210" cy="460" r="12" fill="#5a4a3a"/>
  <!-- people -->
  <g fill="#8b5a2b">
    <circle cx="340" cy="420" r="10"/>
    <rect x="330" y="430" width="20" height="40" rx="5"/>
    <circle cx="380" cy="410" r="10"/>
    <rect x="370" y="420" width="20" height="45" rx="5"/>
    <circle cx="300" cy="430" r="10"/>
    <rect x="290" y="440" width="20" height="35" rx="5"/>
  </g>
  <!-- virus particles in air -->
  <circle cx="360" cy="360" r="12" fill="#e8f4fd" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="500" cy="380" r="10" fill="#e8f4fd" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="150" cy="120" r="8" fill="#e8f4fd" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#8b5a2b">校园 · 医院 · 公共交通</text>
</svg>