<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="static/css/hp-timeline.css">
  <script src="static/js/hp-timeline-3d.js" defer></script>
</head>
<body>
  <div class="hp-3d-hero" id="hp-timeline-hero">
    <div class="timeline-orbit-container">
      <div class="timeline-stage">
        <div class="timeline-scene"><div class="timeline-ring"></div></div>
      </div>
      <div class="orbit-stage">
        <div class="orbit-scene"><div class="orbit-ring"></div></div>
      </div>
    </div>
    <div class="timeline-controls">
      <button class="timeline-btn prev" type="button">‹</button>
      <input class="timeline-slider" type="range" min="0" max="100" value="0" step="0.1">
      <button class="timeline-btn next" type="button">›</button>
    </div>
  </div>
  <section id="section-overview"></section>
  <section id="section-carousel"></section>
  <section id="section-southchina"></section>
  <section id="section-dialogues"></section>
  <section id="section-education"></section>
</body>
</html>
