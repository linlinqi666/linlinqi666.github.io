<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 动态时间轴透视轨道 - Demo v4</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary: #4a3b2a;
      --color-cream: #f6f1e7;
      --color-bg: #faf8f3;
      --color-accent: #8b7355;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--color-bg);
      color: var(--color-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .timeline-orbit-container {
      max-width: 1100px;
      margin: calc(3.5rem + 100px) auto 2rem;
      padding: 0 20px;
    }

    .container-header {
      text-align: center;
      margin-bottom: 0.6rem;
    }

    .container-header h1 { font-size: 1.7rem; font-weight: 600; }
    .container-header .subtitle { font-size: 0.9rem; color: var(--color-accent); opacity: 0.75; }

    /* ===== 顶部：3D 时间线轨道 ===== */
    .timeline-stage {
      position: relative;
      width: 100%;
      height: 100px;
      margin-bottom: 0;
      perspective: 750px;
      perspective-origin: 50% 50%;
    }

    .timeline-scene {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      /* 场景向后仰18deg，让圆环呈现椭圆纵深；由 rAF 每帧写入 transform，不加 CSS transition */
      transform: translateY(0px) rotateX(18deg) rotateY(0deg);
      will-change: transform;
      opacity: 0;
    }

    .timeline-ring {
      position: absolute;
      left: 50%; top: 50%;
      width: calc(2 * var(--tr, 300px));
      height: calc(2 * var(--tr, 300px));
      margin-left: calc(-1 * var(--tr, 300px));
      margin-top: calc(-1 * var(--tr, 300px));
      border-radius: 50%;
      border: 1.5px dashed rgba(139,115,85,0.25);
      transform: rotateX(90deg);
      pointer-events: none;
    }

    .timeline-node {
      position: absolute;
      left: 50%; top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      will-change: transform, opacity, filter;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .timeline-node-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--color-accent);
      border: 2px solid var(--color-cream);
      box-shadow: 0 0 0 1.5px var(--color-accent);
      margin-bottom: 5px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .timeline-node.active .timeline-node-dot {
      background: var(--color-primary);
      box-shadow: 0 0 0 2.5px var(--color-primary), 0 0 10px rgba(74,59,42,0.45);
      transform: scale(1.35);
    }

    .timeline-node-label {
      font-size: 0.75rem;
      white-space: nowrap;
      color: var(--color-accent);
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.8;
      transition: all 0.3s ease;
      font-variant-numeric: tabular-nums;
    }

    .timeline-node.active .timeline-node-label {
      color: var(--color-primary);
      font-size: 0.82rem;
      opacity: 1;
    }

    /* ===== 中间：图片轨道舱（卡片垂直地面） ===== */
    .orbit-stage {
      position: relative;
      width: 100%;
      height: 360px;
      margin-top: -60px;
      perspective: 950px;
      perspective-origin: 50% 42%;
      background: radial-gradient(ellipse at center, rgba(74,59,42,0.03) 0%, transparent 70%);
      border-radius: 16px;
    }

    .orbit-scene {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      /* 场景后仰18deg；卡片用 -18deg 抵消保持竖直；rAF 直接写 transform */
      transform: translateY(0px) rotateX(18deg) rotateY(0deg);
      will-change: transform;
      opacity: 0;
    }

    .orbit-ring {
      position: absolute;
      left: 50%; top: 50%;
      width: calc(2 * var(--r, 280px));
      height: calc(2 * var(--r, 280px));
      margin-left: calc(-1 * var(--r, 280px));
      margin-top: calc(-1 * var(--r, 280px));
      border-radius: 50%;
      border: 2px dashed rgba(74,59,42,0.22);
      transform: rotateX(90deg);
      pointer-events: none;
    }

    .orbit-card {
      position: absolute;
      left: 50%; top: 50%;
      width: 250px; height: 175px;
      margin-left: -125px; margin-top: -87.5px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: linear-gradient(135deg, #d8cab0, #b9a888);
      border: 3px solid rgba(246,241,231,0.95);
      box-shadow: 0 14px 32px -12px rgba(74,59,42,0.45);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      transition: box-shadow 0.4s ease;
    }

    .orbit-card .orbit-card-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(74,59,42,0.4); font-size: 0.85rem; letter-spacing: 0.05em;
    }

    .orbit-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block; pointer-events: none;
    }

    .orbit-card.front {
      box-shadow: 0 28px 52px -14px rgba(74,59,42,0.55), 0 0 0 1px rgba(74,59,42,0.15);
    }

    /* ===== 底部拖动条 ===== */
    .slider-control {
      position: relative;
      height: 56px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 40px; margin-top: 2px;
    }

    .slider-wrapper {
      position: relative;
      width: 100%; max-width: 760px; height: 40px;
      display: flex; align-items: center;
    }

    .slider-track {
      position: absolute; width: 100%; height: 5px;
      background: linear-gradient(90deg, rgba(139,115,85,0.1), rgba(139,115,85,0.28), rgba(139,115,85,0.1));
      border-radius: 3px; overflow: hidden;
    }

    .slider-fill {
      position: absolute; left: 0; height: 100%;
      background: linear-gradient(90deg, var(--color-accent), var(--color-primary));
      border-radius: 3px; width: 0%;
    }

    .slider-input {
      position: relative; width: 100%; height: 40px;
      -webkit-appearance: none; appearance: none;
      background: transparent; cursor: grab; z-index: 2; margin: 0;
    }
    .slider-input:active { cursor: grabbing; }

    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--color-cream), #fff);
      border: 3px solid var(--color-primary);
      box-shadow: 0 4px 14px rgba(74,59,42,0.32), inset 0 1px 0 rgba(255,255,255,0.8);
      cursor: grab; transition: transform 0.16s ease;
    }
    .slider-input::-webkit-slider-thumb:hover { transform: scale(1.12); }
    .slider-input::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.03); }
    .slider-input::-moz-range-thumb {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--color-cream), #fff);
      border: 3px solid var(--color-primary);
      box-shadow: 0 4px 14px rgba(74,59,42,0.32); cursor: grab;
    }

    /* ===== 详情面板（照搬 HP 文章结构） ===== */
    .detail-panel {
      margin-top: 8px;
      background: var(--color-cream);
      border-radius: 14px;
      border: 1px solid rgba(74,59,42,0.1);
      box-shadow: 0 10px 36px -14px rgba(74,59,42,0.26);
      overflow: hidden;
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22,1,0.36,1);
    }
    .detail-panel.show { opacity: 1; transform: translateY(0); }
    .detail-viewport { overflow: hidden; }
    .detail-track {
      display: flex;
      transition: transform 0.42s cubic-bezier(0.22,1,0.36,1);
      will-change: transform;
    }
    .detail-slide { flex: 0 0 100%; padding: 26px 30px 30px; }

    /* 文章章节头部（编号 + 标题 + 副标题） */
    .detail-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
    .detail-num {
      flex-shrink: 0;
      font-size: 1.45rem; font-weight: 700;
      color: var(--color-accent);
      line-height: 1; padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .detail-headtext h3 { font-size: 1.2rem; font-weight: 700; line-height: 1.4; }
    .detail-sub { font-size: 0.82rem; color: var(--color-accent); opacity: 0.78; margin-top: 4px; }

    .detail-intro {
      font-size: 0.92rem; line-height: 1.72; color: rgba(74,59,42,0.8);
      margin-bottom: 16px;
    }

    /* 专家介绍卡 */
    .detail-expert {
      display: flex; gap: 16px; align-items: center;
      background: rgba(74,59,42,0.05);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    }
    .detail-expert-avatar {
      width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #cbb89a, #a8906f);
      display: flex; align-items: center; justify-content: center;
      color: rgba(246,241,231,0.9); font-size: 1.3rem; font-weight: 700;
      overflow: hidden;
    }
    .detail-expert-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .detail-expert-name { font-size: 1rem; font-weight: 700; }
    .detail-expert-title { font-size: 0.8rem; color: var(--color-accent); margin: 2px 0 4px; }
    .detail-expert-field { font-size: 0.8rem; line-height: 1.55; color: rgba(74,59,42,0.7); }

    /* 照片墙（占位，待你给真实路径） */
    .detail-photos {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px;
    }
    .detail-photo {
      position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden;
      background: linear-gradient(135deg, #ddd0b8, #c3b291);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
    .detail-photo span {
      position: absolute; bottom: 0; left: 0; right: 0;
      font-size: 0.68rem; color: rgba(74,59,42,0.55);
      background: rgba(246,241,231,0.7); padding: 2px 4px; text-align: center;
    }

    /* 要点卡片网格 */
    .detail-insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .detail-insight {
      background: rgba(74,59,42,0.04);
      border-left: 3px solid var(--color-accent);
      border-radius: 7px; padding: 11px 13px;
    }
    .detail-insight h4 { font-size: 0.88rem; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
    .detail-insight h4::before {
      content: ""; width: 9px; height: 9px; border-radius: 50%;
      background: var(--color-accent); flex-shrink: 0;
    }
    .detail-insight p { font-size: 0.8rem; line-height: 1.58; color: rgba(74,59,42,0.7); }

    .detail-counter { text-align: center; font-size: 0.76rem; color: var(--color-accent); letter-spacing: 0.1em; padding: 8px 0 2px; opacity: 0.65; }

    @media (max-width: 768px) {
      .orbit-stage { height: 290px; perspective: 720px; margin-top: -36px; }
      .orbit-card { width: 150px; height: 105px; margin-left: -75px; margin-top: -52.5px; }
      .timeline-stage { height: 64px; }
      .slider-input::-webkit-slider-thumb { width: 24px; height: 24px; }
      .detail-slide { padding: 18px 16px 20px; }
      .detail-slide .detail-headtext h3 { font-size: 1.08rem; }
      .detail-photos { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-scene,.timeline-scene,.orbit-card,.timeline-node,
      .detail-panel,.detail-track,.slider-fill { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="timeline-orbit-container">

    <!-- 顶部：3D 时间线轨道 -->
    <div class="timeline-stage" id="timelineStage">
      <div class="timeline-scene" id="timelineScene" style="--tr: 300px; opacity: 0;">
        <div class="timeline-ring"></div>
      </div>
    </div>

    <!-- 中间：图片 3D 轨道舱 -->
    <div class="orbit-stage" id="orbitStage">
      <div class="orbit-scene" id="orbitScene" style="--r: 280px; opacity: 0;">
        <div class="orbit-ring"></div>
      </div>
    </div>

    <!-- 底部拖动条（滑块值 = 角度，0~360° 直接对应） -->
    <div class="slider-control">
      <div class="slider-wrapper">
        <div class="slider-track"><div class="slider-fill" id="sliderFill"></div></div>
        <input type="range" class="slider-input" id="sliderInput"
               min="0" max="3600" value="0" step="1">
      </div>
    </div>

    <!-- 详情面板（点击图片/时间节点才跳转，照搬 HP 文章结构） -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-viewport"><div class="detail-track" id="detailTrack"></div></div>
      <div class="detail-counter" id="detailCounter"></div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // ========== 数据（结构照搬现有 HP 文章；图片待你给路径后填 img） ==========
    var articles = [
      {
        time: '00',
        title: '概述',
        subtitle: 'Human Practices 总体介绍',
        intro: '我们的 Human Practices（HP）工作贯穿项目始终，通过与临床专家、教育工作者、青少年学生及产业界的持续对话，将实验室中的工程设计与真实社会需求连接。从需求确认到科学传播，每一次交流都推动项目从技术研发走向负责任、可持续的创新。',
        photos: [{ c: '总览' }, { c: '团队' }, { c: '活动' }, { c: '成果' }],
        points: [
          { h: '以需求为导向', p: '倾听一线声音，校准技术目标。' },
          { h: '科学传播', p: '让合成生物学走近公众与青少年。' },
          { h: '多方协作', p: '连接医疗、教育与产业资源。' }
        ]
      },
      {
        time: '01',
        title: '清华大学附属中学交流活动',
        subtitle: '2025.06 · 高中校园科普展示',
        intro: '团队走进清华大学附属中学开展 iGEM 项目展示与合成生物学科普活动。通过互动实验演示和项目讲解，让高中生近距离感受合成生物学的魅力，并收集了来自未来探索者的真实反馈。',
        photos: [
          { c: '开幕现场' }, { c: '现场交流' }, { c: '实验展示' }, { c: '互动问答' },
          { c: '合影留念' }, { c: '观众互动' }
        ],
        points: [
          { h: '互动实验', p: '演示工程化酵母生物传感器的原理。' },
          { h: '项目讲解', p: '介绍 iGEM 理念与项目研究意义。' },
          { h: '未来用户', p: '收集高中生对检测技术的直观看法。' }
        ]
      },
      {
        time: '02',
        title: '与临床检验专家的交流',
        subtitle: '专家访谈：听见一线的声音',
        intro: '与深圳市妇幼保健院检验科主任王文杰老师深入交流，从真实医疗需求出发优化项目方向。专家反馈帮助我们跳出“病毒亚型鉴定”的技术执念，将项目重新锚定在“快速、广谱、便捷的病毒监测与公共环境预警”上。',
        expert: {
          name: '王文杰',
          title: '深圳市妇幼保健院检验科主任 · 南方科技大学医学院教学督导',
          field: '长期从事新型生物学诊断标志物、肿瘤与自噬等方向研究；在临床检验与体外诊断领域具有丰富经验。',
          tags: ['新型生物学诊断标志物', '肿瘤与自噬', '临床检验', '体外诊断']
        },
        photos: [{ c: '访谈现场' }, { c: '交流记录' }, { c: '资料' }, { c: '合影' }],
        points: [
          { h: '一线需求', p: '医院检测重在快速判断感染而非亚型。' },
          { h: '技术局限', p: '现有检测依赖症状与病毒载量，存在滞后。' },
          { h: '未来方向', p: '从被动治疗转向主动环境监测预警。' }
        ]
      },
      {
        time: '03',
        title: '面向中学生的科学传播',
        subtitle: '深圳市第一职业技术学校坪山校区 · 高二学生科普交流',
        intro: '走进深圳市第一职业技术学校坪山校区，与高二学生开展科普交流活动。团队尝试把复杂的生物学原理转化为易懂语言，学生关于便携性与检测速度的反馈为产品化方向提供了宝贵参考。',
        photos: [
          { c: '活动合影' }, { c: '课堂全景' }, { c: '项目讲解' }, { c: '科普展示' }
        ],
        points: [
          { h: '科普分享', p: '介绍 iGEM 与合成生物学应用场景。' },
          { h: '用户视角', p: '学生关注便携化与检测速度。' },
          { h: 'RRI 理念', p: '体现负责任的研究与创新精神。' }
        ]
      },
      {
        time: '04',
        title: '行业企业调研',
        subtitle: '体外诊断（IVD）产业需求对接',
        intro: '走访深圳本地生物医药企业，了解体外诊断（IVD）行业市场需求与技术趋势，探索项目成果的产业化可能性，进一步梳理从实验室走向产品化的关键要素。',
        photos: [{ c: '企业参访' }, { c: '产品演示' }, { c: '座谈' }, { c: '实验室' }],
        points: [
          { h: '产业对接', p: '了解 IVD 市场真实痛点。' },
          { h: '转化路径', p: '明确产品化需考虑的监管与成本。' },
          { h: '持续优化', p: '根据产业反馈完善传感器设计。' }
        ]
      },
      {
        time: '05',
        title: '社区健康宣传',
        subtitle: '让科研成果反哺社会',
        intro: '在社区开展流感预防知识宣传活动，普及病毒检测的重要性，提升公众对公共卫生的认知水平，让科研成果反哺社会。',
        photos: [{ c: '宣传摊位' }, { c: '互动问答' }, { c: '资料发放' }, { c: '现场' }],
        points: [
          { h: '公众参与', p: '降低科研门槛，拉近科学与社区距离。' },
          { h: '健康传播', p: '普及流感预防与早期监测意识。' },
          { h: '社会价值', p: '从实验室走向真实公共健康场景。' }
        ]
      }
    ];

    // ========== DOM ==========
    var orbitScene = document.getElementById('orbitScene');
    var timelineScene = document.getElementById('timelineScene');
    var orbitStage = document.getElementById('orbitStage');
    var timelineStage = document.getElementById('timelineStage');
    var sliderInput = document.getElementById('sliderInput');
    var sliderFill = document.getElementById('sliderFill');
    var detailPanel = document.getElementById('detailPanel');
    var detailTrack = document.getElementById('detailTrack');
    var detailCounter = document.getElementById('detailCounter');

    // ========== 状态（全部由 computeLayout 按文章数 n 动态推导） ==========
    var n = articles.length;
    var step = 360 / n;        // 每张卡片所需转动角度，随 n 变化
    var DEG = Math.PI / 180;
    var TILT = 18;
    var rOrbit = 280;          // 图片轨道半径（动态）
    var rTimeline = 300;       // 时间线轨道半径（动态）
    var cardW = 250, cardH = 175; // 卡片尺寸（动态）

    // 滑块值即角度：value 0~max = 首图~末图；负向旋转（方向已按需求反转）
    var targetAngle = 0, currentAngle = 0, LERP = 0.11;
    var cards = [], tlnodes = [], lastFrontIdx = -1;
    var snapActive = false; // 释放/跳转时为 true：滑块随 currentAngle 缓动，不瞬间跳

    // 根据文章数量动态计算布局：卡片角度、轨道半径、卡片尺寸、舞台高度
    // 文章越多 → 角度越小、卡片自动缩小、半径自适应，保证不重叠且观感稳定
    function computeLayout(count) {
      var isMobile = window.innerWidth <= 768;
      var s = 360 / count;
      var mobileFactor = isMobile ? 0.6 : 1;
      // 先按桌面期望最大卡宽 250 估算所需半径（弧长=卡宽*1.18）
      var arc = 250 * 1.18;
      var r = arc * count / (2 * Math.PI);
      // 半径上限：桌面 360；移动端按视口宽度自适应，下限 170
      var rMax = isMobile ? Math.max(150, (window.innerWidth - 50) * 0.95) : 360;
      r = Math.max(170, Math.min(r, rMax));
      // 实际卡宽 = 该半径下能容纳的最大宽（留间隙），再乘移动端系数，且不超过 250
      var w = Math.min(250, (2 * Math.PI * r / count) - 24) * mobileFactor;
      w = Math.max(82, w);
      var h = w * 0.7;
      return { step: s, r: r, cardW: w, cardH: h, isMobile: isMobile };
    }

    // 应用布局：写全局变量 + 场景半径变量 + 舞台高度 + 两轴间距
    function applyLayout() {
      var L = computeLayout(n);
      step = L.step;
      rOrbit = L.r;
      rTimeline = L.r * (L.isMobile ? 1.05 : 1.08);
      cardW = L.cardW; cardH = L.cardH;

      orbitScene.style.setProperty('--r', rOrbit + 'px');
      timelineScene.style.setProperty('--tr', rTimeline + 'px');

      var ringV = rOrbit * Math.sin(TILT * DEG);
      orbitStage.style.height = (ringV * 2 + cardH + 44) + 'px';
      var tV = rTimeline * Math.sin(TILT * DEG);
      timelineStage.style.height = (tV * 2 + 30) + 'px';
      // 两轴间距随环大小自适应（约拉近 60px）
      orbitStage.style.marginTop = (-Math.min(60, tV * 0.6)) + 'px';

      layoutCards();
      layoutNodes();
    }

    // 按当前全局尺寸/角度刷新已渲染卡片的位置与大小
    function layoutCards() {
      cards.forEach(function(c, i) {
        c.style.width = cardW + 'px';
        c.style.height = cardH + 'px';
        c.style.marginLeft = (-cardW / 2) + 'px';
        c.style.marginTop = (-cardH / 2) + 'px';
        c._baseAngle = i * step;
        c.style.transform =
          'rotateY(' + (i * step) + 'deg) translateZ(' + rOrbit + 'px) rotateX(' + (-TILT) + 'deg)';
      });
    }

    function layoutNodes() {
      tlnodes.forEach(function(node, i) {
        node._baseAngle = i * step;
        node.style.transform =
          'rotateY(' + (i * step) + 'deg) translateZ(' + rTimeline + 'px) rotateX(' + (-TILT) + 'deg)';
      });
    }

    // 滑块值 → 场景角度：f=0 对应首图(角度0)，f=1 对应末图(角度 -(n-1)*step)
    function valueToAngle(v) {
      var f = parseFloat(v) / parseFloat(sliderInput.max);
      return -f * (n - 1) * step;
    }
    // 场景角度 → 滑块值（与上面互逆，保证拖动/点击映射一致）
    function angleToValue(a) {
      return (-a / ((n - 1) * step)) * parseFloat(sliderInput.max);
    }

    // ========== 初始化 ==========
    function init() {
      applyLayout();        // 先按当前文章数确定角度/半径/尺寸
      renderCards();
      renderTimelineNodes();
      renderDetailSlides();
      bindEvents();
      startLoop();

      window.addEventListener('resize', function() {
        applyLayout();      // 窗口变化（含移动端切换）时重新自适应
      });

      requestAnimationFrame(function() {
        orbitScene.style.opacity = '1';
        timelineScene.style.opacity = '1';
        detailPanel.classList.add('show');
        updateDetailPanel(0);
      });
    }

    function renderCards() {
      articles.forEach(function(a, i) {
        var card = document.createElement('figure');
        card.className = 'orbit-card'; card.dataset.index = i;
        if (a.img) {
          var im = document.createElement('img'); im.src = a.img; im.alt = a.title; im.loading = 'lazy';
          card.appendChild(im);
        } else {
          var ph = document.createElement('div'); ph.className = 'orbit-card-placeholder'; ph.textContent = '图片待更新';
          card.appendChild(ph);
        }
        orbitScene.appendChild(card);
        cards.push(card);
      });
      layoutCards(); // 由 applyLayout 设定的全局尺寸统一摆放
    }

    function renderTimelineNodes() {
      articles.forEach(function(a, i) {
        var node = document.createElement('div');
        node.className = 'timeline-node' + (i === 0 ? ' active' : '');
        node.dataset.index = i;
        var dot = document.createElement('div'); dot.className = 'timeline-node-dot';
        var label = document.createElement('span'); label.className = 'timeline-node-label'; label.textContent = a.time;
        node.appendChild(dot); node.appendChild(label);
        timelineScene.appendChild(node);
        tlnodes.push(node);
      });
      layoutNodes();
    }

    function renderDetailSlides() {
      articles.forEach(function(a) {
        var s = document.createElement('div'); s.className = 'detail-slide';

        // 章节头部：编号 + 标题 + 副标题
        var head = document.createElement('div'); head.className = 'detail-head';
        var num = document.createElement('div'); num.className = 'detail-num'; num.textContent = a.time;
        var ht = document.createElement('div'); ht.className = 'detail-headtext';
        var ttl = document.createElement('h3'); ttl.textContent = a.title;
        ht.appendChild(ttl);
        if (a.subtitle) { var sub = document.createElement('div'); sub.className = 'detail-sub'; sub.textContent = a.subtitle; ht.appendChild(sub); }
        head.appendChild(num); head.appendChild(ht);
        s.appendChild(head);

        // 导语
        if (a.intro) { var intro = document.createElement('p'); intro.className = 'detail-intro'; intro.textContent = a.intro; s.appendChild(intro); }

        // 专家介绍（仅 02 号有）
        if (a.expert) {
          var ex = document.createElement('div'); ex.className = 'detail-expert';
          var av = document.createElement('div'); av.className = 'detail-expert-avatar';
          av.textContent = a.expert.name.charAt(0);
          var ei = document.createElement('div');
          var en = document.createElement('div'); en.className = 'detail-expert-name'; en.textContent = a.expert.name;
          var et = document.createElement('div'); et.className = 'detail-expert-title'; et.textContent = a.expert.title;
          var ef = document.createElement('div'); ef.className = 'detail-expert-field'; ef.textContent = a.expert.field;
          ei.appendChild(en); ei.appendChild(et); ei.appendChild(ef);
          ex.appendChild(av); ex.appendChild(ei);
          s.appendChild(ex);
        }

        // 照片墙（占位，待真实路径）
        if (a.photos && a.photos.length) {
          var pg = document.createElement('div'); pg.className = 'detail-photos';
          a.photos.forEach(function(ph) {
            var fig = document.createElement('figure'); fig.className = 'detail-photo';
            if (ph.img) { var im = document.createElement('img'); im.src = ph.img; im.alt = ph.c || ''; fig.appendChild(im); }
            if (ph.c) { var cap = document.createElement('span'); cap.textContent = ph.c; fig.appendChild(cap); }
            pg.appendChild(fig);
          });
          s.appendChild(pg);
        }

        // 要点卡片
        if (a.points && a.points.length) {
          var ins = document.createElement('div'); ins.className = 'detail-insights';
          a.points.forEach(function(pt) {
            var b = document.createElement('div'); b.className = 'detail-insight';
            var h4 = document.createElement('h4'); h4.textContent = pt.h;
            var p = document.createElement('p'); p.textContent = pt.p;
            b.appendChild(h4); b.appendChild(p); ins.appendChild(b);
          });
          s.appendChild(ins);
        }

        detailTrack.appendChild(s);
      });
    }

    // ========== 动画循环（两个场景同步旋转，滑块值即角度，不回写） ==========
    function startLoop() {
      function loop() {
        var d = targetAngle - currentAngle;
        currentAngle += Math.abs(d) > 0.01 ? d * LERP : 0;

        // 吸附/跳转期间：让滑块随 currentAngle 缓动到目标，避免瞬间闪现
        if (snapActive) {
          var sv = angleToValue(currentAngle);
          sv = Math.max(0, Math.min(parseFloat(sliderInput.max), sv));
          sliderInput.value = sv.toFixed(0);
          syncSliderFill();
          if (Math.abs(targetAngle - currentAngle) < 0.05) snapActive = false;
        }

        var tf = 'translateY(0px) rotateX(' + TILT + 'deg) rotateY(' + currentAngle + 'deg)';
        orbitScene.style.transform = tf;
        timelineScene.style.transform = tf;

        updatePerspective();
        updateTimelinePerspective();

        requestAnimationFrame(loop);
      }
      loop();
    }

    function getFrontIndex() {
      var md = Infinity, fi = 0;
      cards.forEach(function(c, i) {
        var norm = (((c._baseAngle + currentAngle) % 360) + 360) % 360;
        var diff = norm > 180 ? 360 - norm : norm;
        if (diff < md) { md = diff; fi = i; }
      });
      return fi;
    }

    function updatePerspective() {
      var fi = getFrontIndex();
      cards.forEach(function(c, i) {
        var norm = (((c._baseAngle + currentAngle) % 360) + 360) % 360;
        var t = (1 - Math.cos(norm * DEG)) / 2;
        c.style.zIndex = Math.round(100 - 100 * t);
        c.style.opacity = Math.max(0, 1 - t * t).toFixed(3);
        c.style.filter = t > 0.55 ? 'blur(' + (3*(t-0.55)/0.45).toFixed(2)+'px)' : 'none';
        c.classList.toggle('front', i === fi && t < 0.25);
      });
    }

    function updateTimelinePerspective() {
      var fi = getFrontIndex();
      if (fi !== lastFrontIdx) {
        lastFrontIdx = fi;
        tlnodes.forEach(function(n, i) { n.classList.toggle('active', i === fi); });
        /* 详情面板不随拖动联动，只有用户主动点击才切换 */
      }
      tlnodes.forEach(function(node) {
        var norm = (((node._baseAngle + currentAngle) % 360) + 360) % 360;
        var t = (1 - Math.cos(norm * DEG)) / 2;
        node.style.opacity = Math.max(0.15, 1 - t*0.65).toFixed(3);
        node.style.zIndex = Math.round(50 - 50*t);
      });
    }

    function updateDetailPanel(idx) {
      detailTrack.style.transform = 'translateX(' + (-idx * 100) + '%)';
      detailCounter.textContent = (idx+1) + ' / ' + n;
    }

    function syncSliderFill() {
      sliderFill.style.width = (parseFloat(sliderInput.value) / parseFloat(sliderInput.max) * 100) + '%';
    }

    // ========== 事件 ==========
    function bindEvents() {
      // 拖动：滑块值直接 = 目标角度，用户掌控滑块，吸附暂停
      sliderInput.addEventListener('input', function() {
        targetAngle = valueToAngle(sliderInput.value);
        snapActive = false;
        syncSliderFill();
      });
      // 释放后吸附到离用户最近的卡片（缓动停止，滑块随轨道一起平滑移动）
      sliderInput.addEventListener('mouseup', snapToNearest);
      sliderInput.addEventListener('touchend', snapToNearest);
      sliderInput.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') snapToNearest();
      });

      // 点击时间节点：转动到该图 + 切换文章详情
      tlnodes.forEach(function(nd, i) {
        nd.addEventListener('click', function() { goTo(i); updateDetailPanel(i); });
      });
      // 点击任意卡片：仅做定位（转动到该图），不切换文章
      cards.forEach(function(c, i) {
        c.addEventListener('click', function() { goTo(i); });
      });

      document.addEventListener('keydown', function(e) {
        if(!document.getElementById('orbitStage').matches(':hover')) return;
        if(e.key==='ArrowRight'){e.preventDefault();go(1);}
        else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
      });
    }

    // 跳转到第 idx 张卡片的正前方（滑块由 loop 缓动跟随，不瞬间跳）
    function goTo(idx) {
      targetAngle = -idx * step;
      snapActive = true;
    }

    // 释放滑块后吸附到离用户最近的卡片
    function snapToNearest() {
      var f = parseFloat(sliderInput.value) / parseFloat(sliderInput.max);
      var idx = Math.max(0, Math.min(n - 1, Math.round(f * (n - 1))));
      targetAngle = -idx * step;
      snapActive = true;
    }

    function go(dir) { goTo((getFrontIndex() - dir + n) % n); }

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
    else init();
  })();
  </script>
</body>
</html>
